name: Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install build tool
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name PropanBot propanbot.py
      - name: Test EXE without token or network
        run: .\dist\PropanBot.exe --self-test
      - name: Package clean distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/PropanBot -Force
          Copy-Item dist/PropanBot.exe,START.bat,STOP.bat,.env.example,README_UZ.md -Destination package/PropanBot
          Compress-Archive -Path package/PropanBot -DestinationPath PropanBot-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PropanBot-Windows
          path: PropanBot-Windows.zip
          if-no-files-found: error
          retention-days: 14
